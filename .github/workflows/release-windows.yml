# Builds a Windows player and publishes it as a GitHub release.
#
# Trigger: push a version tag, e.g.  git tag v0.5.0 && git push origin v0.5.0
#          (or run it by hand from the Actions tab; that only uploads the zip as a workflow artifact).
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   UNITY_EMAIL, UNITY_PASSWORD  – the Unity ID that holds your Personal licence
#   UNITY_LICENSE                – contents of your Unity_lic.ulf
#                                  (Windows: C:\ProgramData\Unity\Unity_lic.ulf)
# See https://game.ci/docs/github/activation for details.

name: Release Windows build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Windows-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Windows-

      - name: Build (Unity, Windows 64-bit, Mono)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: AgaRPG
          buildsPath: build
          # Unity version is read from ProjectSettings/ProjectVersion.txt. If GameCI has no image
          # for that exact version yet, pin a nearby Unity 6 version here, e.g.  unityVersion: 6000.x.yf1

      - name: Zip player
        id: zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="dev-${GITHUB_SHA::7}"
          ZIP="AgaRPG-Windows-v${VERSION}.zip"
          cd build/StandaloneWindows64
          sudo rm -rf ./*DoNotShip*
          zip -qr "../../${ZIP}" .
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.zip }}
          path: ${{ steps.zip.outputs.zip }}

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.zip }}
          generate_release_notes: true
          body: |
            **Windows (64-bit):** download the zip below, extract it anywhere and run `AgaRPG.exe`.

            Press **Play** to join an open game or host a new one; other players join you over the
            internet automatically (no port forwarding). You can also start the game twice on one
            PC to play against yourself.

            Windows may show "Windows protected your PC" because the game isn't code-signed:
            click **More info → Run anyway**.
